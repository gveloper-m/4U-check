name: Publish MCP Agent Image

on:
  push:
    branches: [master]
    paths:
      - '4u-test-agent/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Nuitka compilation takes 10-20 min; allow up to 40 min
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./4u-test-agent
          push: true
          tags: |
            4utest/mcp-agent:latest
            4utest/mcp-agent:${{ github.sha }}
          # Layer cache keeps Nuitka + pip installs warm between pushes.
          # The Nuitka compilation step itself is also cached via BuildKit.
          cache-from: type=gha
          cache-to: type=gha,mode=max
