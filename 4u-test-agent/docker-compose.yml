name: 4utest-agent

services:
  agent:
    image: 4utest/mcp-agent:latest
    restart: unless-stopped
    ports:
      - "${MCP_SERVER_PORT:-8765}:8765"
    env_file:
      - .env
    volumes:
      # ⚠  Change the left side to your actual project path
      - /var/www/your-project:/workspace
      - ./backups:/backups
