name: 4utest

# ──────────────────────────────────────────────────────────────────────────────
# Production Docker Compose for 4uTest
#
# Services:
#   nginx     – Nginx reverse proxy + SSL termination (Let's Encrypt)
#   php-fpm   – Laravel 13 PHP-FPM (+ Chromium for audits)
#   horizon   – Laravel Horizon queue dashboard / worker
#   scheduler – Laravel task scheduler
#   mysql     – MySQL 8.4 database
#   redis     – Redis 7 cache + queue backend
#   certbot   – Certbot (auto-renews Let's Encrypt certificates)
#
# Usage:
#   1. Copy .env.example to .env and fill in all values
#   2. Run ./scripts/init-letsencrypt.sh once to obtain SSL certificates
#   3. Subsequent deploys: ./scripts/deploy.sh
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Nginx ──────────────────────────────────────────────────────────────────
  nginx:
    build:
      context: ../
      dockerfile: app-deploy/frontend/Dockerfile
    image: 4utest-frontend:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    environment:
      DOMAIN: ${DOMAIN}
      # Only substitute ${DOMAIN} – leave nginx $variables untouched
      NGINX_ENVSUBST_TEMPLATE_VARS: DOMAIN
    networks:
      - 4utest
    depends_on:
      - php-fpm
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/up || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── PHP-FPM (Laravel app) ──────────────────────────────────────────────────
  php-fpm:
    build:
      context: ../
      dockerfile: app-deploy/backend/Dockerfile
    image: 4utest-backend:latest
    restart: unless-stopped
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - 4utest
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CHROME_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9000' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Laravel Horizon (queue worker) ────────────────────────────────────────
  horizon:
    image: 4utest-backend:latest
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - 4utest
    depends_on:
      php-fpm:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CHROME_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium

  # ── Laravel Scheduler ─────────────────────────────────────────────────────
  scheduler:
    image: 4utest-backend:latest
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - 4utest
    depends_on:
      php-fpm:
        condition: service_healthy
    env_file:
      - .env

  # ── MySQL 8.4 ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - 4utest
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - 4utest
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Certbot (Let's Encrypt auto-renewal) ──────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Check for renewal every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  4utest:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  app_storage:
  app_bootstrap_cache:
  certbot_certs:
  certbot_webroot:
