; -------------------------------------------------------
; Production PHP settings for 4uTest web audit engine
; -------------------------------------------------------

; Memory – audit jobs parse large HTML responses + run Chrome
memory_limit = 2G

; Execution time – full audits can take several minutes
max_execution_time = 600
max_input_time = 600

; Uploads / form data
post_max_size = 100M
upload_max_filesize = 100M
max_input_vars = 10000

; Network / socket timeouts
default_socket_timeout = 120

; OPcache – production defaults
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.fast_shutdown = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

; Timezone
date.timezone = UTC

; Error display (off in production – log instead)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php_errors.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
